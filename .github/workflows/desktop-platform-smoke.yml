name: Desktop platform smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
          - os: macos-latest
            bundle: dmg

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: Swatinem/rust-cache@v2
      - name: Rust format
        run: cargo fmt --check
      - name: Rust tests
        run: cargo test --workspace
      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Shell model tests
        run: node --test crates/dms-desktop/ui/app.test.mjs
      - name: Launch desktop app
        run: cargo run -p dms-desktop
        env:
          DMS_DESKTOP_SMOKE: "1"
      - name: Export multi-page Markdown through the native WebView PDF API
        run: cargo run -p dms-desktop
        env:
          DMS_DESKTOP_EXPORT_SMOKE: "1"
      - name: Build installable desktop package
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: crates/dms-desktop
          args: --bundles ${{ matrix.bundle }}
          uploadWorkflowArtifacts: true
