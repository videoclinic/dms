name: Release Windows installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (must already exist on the remote)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release-windows:
    name: windows-installer
    runs-on: windows-latest
    # 35 min is ~3x the observed cold-build time (~8-12 min): a hung step now
    # fails and ships its partial log instead of burning the full hour
    # (see CHG-0024 for the three hung import runs).
    timeout-minutes: 35

    env:
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
      WINDOWS_CERT_PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PFX_PASSWORD }}
      WINDOWS_CERT_THUMBPRINT: ${{ vars.WINDOWS_CERT_THUMBPRINT }}

    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag exists locally
        shell: bash
        run: |
          git rev-parse --verify "refs/tags/${{ steps.tag.outputs.name }}" >/dev/null \
            || (echo "Tag ${{ steps.tag.outputs.name }} not found locally"; exit 1)

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy, rustfmt

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: Swatinem/rust-cache@v2

      - name: Import Authenticode signing certificate
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_CERT_PFX -or -not $env:WINDOWS_CERT_THUMBPRINT) {
            Write-Warning "WINDOWS_CERT_PFX or WINDOWS_CERT_THUMBPRINT missing; the installer will be uploaded unsigned."
            exit 0
          }
          # Phase markers let a stuck run's completed log show exactly which
          # call blocked.
          #
          # NO Root-store self-trust here, on purpose: writing to
          # Cert:\CurrentUser\Root blocks indefinitely on headless
          # windows-latest runners — observed four times (runs 32159384160,
          # 32163986746 via X509Store.Add keyed; 32169684243 via X509Store.Add
          # keyless; 32176773256 via certutil -addstore). Trust is not needed:
          # the Sign step verifies via Get-AuthenticodeSignature, which reads
          # the embedded signature and needs no trusted root (see CHG-0024).
          Write-Host "[1/3] writing PFX to runner temp"
          $pfxPath = Join-Path $env:RUNNER_TEMP 'dms-cert.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          Write-Host "[2/3] importing PFX into Cert:\CurrentUser\My (carries the private key signtool signs with)"
          $securePwd = if ($env:WINDOWS_CERT_PFX_PASSWORD) {
            ConvertTo-SecureString -String $env:WINDOWS_CERT_PFX_PASSWORD -AsPlainText -Force
          } else { New-Object SecureString }
          $imported = @(Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My `
            -Password $securePwd -Exportable:$false)
          Remove-Item -Path $pfxPath -Force
          # Production PFX bundles carry the full chain; the signing cert is
          # the one whose thumbprint the operator pinned.
          $cert = $imported | Where-Object { ($_.Thumbprint -replace '\s','') -ieq $env:WINDOWS_CERT_THUMBPRINT } | Select-Object -First 1
          if (-not $cert) { throw "No certificate in the PFX matches thumbprint $($env:WINDOWS_CERT_THUMBPRINT)." }
          Write-Host "[3/3] selected signing cert $($cert.Thumbprint) (subject: $($cert.Subject))"

      - name: Build NSIS installer (no release upload)
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: crates/dms-desktop
          args: --bundles nsis
          uploadWorkflowArtifacts: true

      - name: Normalize installer filename (space to underscore)
        shell: pwsh
        run: |
          $nsisDir = 'target/release/bundle/nsis'
          # tauri 2 names the NSIS installer from productName verbatim
          # ("DMS Desktop" -> "DMS Desktop_0.1.0_x64-setup.exe"), and GitHub
          # replaces spaces with dots in uploaded asset names, which would
          # break the documented DMS_Desktop_<version>_x64-setup.exe contract
          # (README, ADR-0027). Normalize before signing so the sign, hash,
          # and publish steps all see one name.
          Get-ChildItem -Path $nsisDir -File | Where-Object { $_.Name -match ' ' } | ForEach-Object {
            $newName = $_.Name -replace ' ', '_'
            Rename-Item -Path $_.FullName -NewName $newName
            Write-Host "Renamed: $($_.Name) -> $newName"
          }
          # Positive gate: the published name must match the documented
          # contract for this build's version, whatever tauri produced.
          $version = (Get-Content crates/dms-desktop/tauri.conf.json -Raw | ConvertFrom-Json).version
          $expected = "DMS_Desktop_${version}_x64-setup.exe"
          if (-not (Test-Path (Join-Path $nsisDir $expected))) {
            $found = (Get-ChildItem -Path $nsisDir -Filter '*.exe' | ForEach-Object { $_.Name }) -join ', '
            throw "Normalized installer not found: expected $expected in $nsisDir; found: $found."
          }
          Write-Host "Installer ready: $expected"

      - name: Sign installer with Authenticode
        if: ${{ env.WINDOWS_CERT_THUMBPRINT != '' }}
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path target/release/bundle/nsis -Filter '*.exe' -Recurse -File |
            Select-Object -First 1
          if (-not $exe) { throw "NSIS installer not found under target/release/bundle/nsis." }
          $candidates = @('C:\Program Files (x86)\Windows Kits\10\bin', 'C:\Program Files\Windows Kits\10\bin')
          $signtool = $candidates | ForEach-Object { Get-ChildItem -Path $_ -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found under Windows Kits; install the Windows 10/11 SDK." }
          & $signtool.FullName sign /tr http://timestamp.digicert.com /td sha256 /fd sha256 `
            /sha1 $env:WINDOWS_CERT_THUMBPRINT $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw "signtool sign exited with $LASTEXITCODE." }
          # Verify via Get-AuthenticodeSignature, NOT `signtool verify /pa`:
          # signtool verify builds a chain against the system trust store,
          # which forces the Root-store self-trust that hangs headless
          # runners (see CHG-0024). Get-AuthenticodeSignature reads the
          # embedded signature: it must come from the pinned cert, and its
          # chain status must be explainable. Accepted outcomes:
          #   Valid        — CA-issued cert chains to a system root
          #   NotTrusted   — untrusted root (Windows PowerShell 5.1 bucket)
          #   UnknownError — pwsh 7 / .NET 8's bucket for the SAME
          #                  "chain terminated in an untrusted root"
          #                  condition (run 32180394018 proved the split),
          #                  accepted only when the status message says so.
          $sig = Get-AuthenticodeSignature -FilePath $exe.FullName
          if (-not ($sig.SignerCertificate.Thumbprint -replace '\s','') -ieq $env:WINDOWS_CERT_THUMBPRINT) {
            throw "Installer signed with $($sig.SignerCertificate.Thumbprint), not the pinned $($env:WINDOWS_CERT_THUMBPRINT)."
          }
          $untrustedRoot = ($sig.StatusMessage -match 'terminated in a root certificate which is not trusted')
          if ($sig.Status -notin @('Valid', 'NotTrusted') -and -not ($sig.Status -eq 'UnknownError' -and $untrustedRoot)) {
            throw "Authenticode status $($sig.Status) for $($sig.StatusMessage)."
          }
          Write-Host "Signed + verified: $($exe.Name) (status: $($sig.Status))"

      - name: Compute SHA-256 sidecar
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path target/release/bundle/nsis -Filter '*.exe' -Recurse -File |
            Select-Object -First 1
          if (-not $exe) { throw "NSIS installer missing for hashing." }
          $hash = (Get-FileHash -Algorithm SHA256 -Path $exe.FullName).Hash.ToLower()
          $sidecar = Join-Path $exe.DirectoryName ("$($exe.Name).sha256")
          Set-Content -Path $sidecar -Value "$hash  $($exe.Name)" -NoNewline
          Write-Host "$hash  $($exe.Name)"

      - name: Publish release with signed installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: 'DMS Desktop ${{ steps.tag.outputs.name }}'
          body: |
            Signed NSIS installer for Windows. Verify the SHA-256 sidecar next to the binary before installing.
            See `docs/changes/active/CHG-0024-windows-nsis-installer-release.md` for the distribution contract.
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.sha256
          fail_on_unmatched_files: true
          draft: true
          prerelease: ${{ contains(steps.tag.outputs.name, '-') }}

      - name: Build winget submission kit
        if: ${{ !contains(steps.tag.outputs.name, '-') }}
        shell: pwsh
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          # Render the three winget-pkgs multi-file manifests (version,
          # installer, defaultLocale) for this release so the operator can
          # `wingetcreate submit` them. The workflow does NOT auto-PR to
          # microsoft/winget-pkgs: the community bot rejects first-submissions
          # from unattended workflows and auto-closes duplicate-version PRs,
          # so the operator runs wingetcreate from a maintainer account.
          # See scripts/winget/Build-WingetKit.ps1 and docs/winget-submission.md.
          $nsisDir = 'target/release/bundle/nsis'
          $exe = Get-ChildItem -Path $nsisDir -Filter '*.exe' -Recurse -File | Select-Object -First 1
          $sidecar = Get-ChildItem -Path $nsisDir -Filter '*.sha256' -Recurse -File | Select-Object -First 1
          if (-not $exe -or -not $sidecar) { throw "winget kit pre-flight: installer or sidecar missing under $nsisDir." }
          $sha = (Get-Content $sidecar.FullName -Raw).Trim().Split()[0]
          $version = (Get-Content crates/dms-desktop/tauri.conf.json -Raw | ConvertFrom-Json).version
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/$($exe.Name)"
          $kitDir = Join-Path $env:RUNNER_TEMP 'winget-bundle'
          if (Test-Path $kitDir) { Remove-Item -Recurse -Force $kitDir }
          & scripts/winget/Build-WingetKit.ps1 `
            -Version $version `
            -InstallerUrl $url `
            -InstallerSha256 $sha `
            -OutputDir $kitDir `
            -ReleaseNotesUrl "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:RELEASE_TAG"
          # Echo the operator's next step into the run summary.
          $packageId = 'Videoclinic.DMSDesktop'
          $nl = [Environment]::NewLine
          $summary = '## Winget submission kit' + $nl + $nl + ('- Package: ' + $packageId + ' v' + $version) + $nl + ('- Installer: ' + $url) + $nl + ('- SHA-256: ' + $sha) + $nl + $nl + 'The three manifests and SUBMIT.md are in the winget-bundle artifact. Download it, unpack, then run `wingetcreate submit --manifests <unpacked>/manifests` from your winget-pkgs fork.' + $nl + $nl + 'See docs/winget-submission.md for the full procedure.'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary -Encoding utf8
        # Step skipped for prerelease tags (e.g. v0.1.0-installer-preview.1) — winget
        # only takes stable versions.

      - name: Upload winget submission kit
        if: ${{ !contains(steps.tag.outputs.name, '-') }}
        uses: actions/upload-artifact@v4
        with:
          name: winget-bundle
          path: ${{ env.RUNNER_TEMP }}/winget-bundle/
          if-no-files-found: error
