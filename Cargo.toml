[workspace]
members = ["crates/dms-core", "crates/dms-cli", "crates/dms-desktop"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = "0.37.5"
pulldown-cmark = "0.13.0"
sha2 = "0.10.9"
thiserror = "2.0"
uuid = { version = "1.11", features = ["serde", "v4"] }
tempfile = "3.14"
tauri = "2.11.5"
tauri-build = "2.6.3"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[workspace.dependencies.block2]
version = "0.6.2"

[workspace.dependencies.objc2-foundation]
version = "0.3.2"
default-features = false
features = ["std", "NSData", "NSError"]

[workspace.dependencies.objc2-web-kit]
version = "0.3.2"
default-features = false
features = ["std", "block2", "WKPDFConfiguration", "WKWebView"]

[workspace.dependencies.webview2-com]
version = "0.38.2"

[workspace.dependencies.windows]
version = "0.61.3"
