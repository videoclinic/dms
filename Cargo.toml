[workspace]
members = ["crates/dms-core", "crates/dms-cli", "crates/dms-desktop"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.11", features = ["serde", "v4"] }
tempfile = "3.14"
tauri = "2.11.5"
tauri-build = "2.6.3"
