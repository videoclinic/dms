<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="print.css">
</head>
<body>
  <header class="document-header">
    <img src="logo.svg" alt="DMS Desktop">
    <div>
      <strong>{{TITLE}}</strong>
      <span>{{DOCUMENT_NUMBER}}</span>
    </div>
  </header>
  <main>{{BODY}}</main>
  <footer class="document-footer">
    <span>Vertraulichkeitsstufe: {{CONFIDENTIALITY}}</span>
    <span>Version: {{VERSION}}</span>
    <span class="page-indicator">Seite <span class="page-number"></span></span>
  </footer>
</body>
</html>
